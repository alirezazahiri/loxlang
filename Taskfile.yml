version: '3'

vars:
  APP: ./cmd/

tasks:

  run:
    desc: Run the interpreter (optionally with a file)
    cmds:
      - |
        if [ -z "{{.FILE}}" ]; then
          go run {{.APP}}
        else
          go run {{.APP}} {{.FILE}}
        fi

  dev:
    desc: Run in dev mode
    cmds:
      - task: run
        vars:
          FILE: "{{.FILE}}"

  repl:
    desc: Start REPL
    cmds:
      - go run {{.APP}}
  
  print:
    desc: Print AST
    cmds:
      - go run {{.APP}}astprinter/ {{.FILE}}
  
  generate:
    desc: Generate AST Codes
    cmds:
      - go run {{.APP}}ast/

  file:
    desc: Run a lox file
    cmds:
      - go run {{.APP}} {{.FILE}}

  build:
    desc: Build binary
    cmds:
      - go build -o bin/lox.exe {{.APP}}

  test:
    desc: Run tests
    cmds:
      - go test ./...

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  lint:
    desc: Run vet
    cmds:
      - go vet ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin
  
  exec: 
    desc: compile and run the code using the binary output
    cmds: 
      - go build -o bin/lox.exe {{.APP}}
      - bin/lox.exe {{.FILE}}
